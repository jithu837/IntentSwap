# render.yaml — Render Blueprint for IntentSwap (Backend + Frontend)
# Docs: https://render.com/docs/yaml-spec

services:
  # ── Backend Web Service ──────────────────────────────────────────────────
  - type: web
    name: intentswap-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: MONGO_URI
        sync: false # Set in Render dashboard (Atlas connection string)
      - key: RPC_URL
        sync: false # Set in Render dashboard (Sepolia RPC URL)
      - key: CONTRACT_ADDRESS
        sync: false # Set in Render dashboard
      - key: SOLVER_PRIVATE_KEY
        sync: false # Set in Render dashboard
      - key: FRONTEND_URL
        value: https://intentswap-frontend.onrender.com
      - key: CORS_ORIGIN
        value: https://intentswap-frontend.onrender.com
    healthCheckPath: /health
    autoDeploy: true

  # ── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: intentswap-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://intentswap-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://intentswap-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
